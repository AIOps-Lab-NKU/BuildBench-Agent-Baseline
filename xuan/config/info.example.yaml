LLM_PROVIDER: "qwen"

paths:
  base_dir: "data/case_study/x86_64_to_aarch64"
  result_dir: "result_text_res"
  temp_work_dir: "temp_workspace"
  log_dir: "result_log_res"

build:
  backend: "docker"
  prebuild: true
  docker:
    validator_command: "/path/to/docker-validator/bin/build-case-docker"
    case_store_dir: "data/case_study/x86_64_to_aarch64"
    result_root: "run_records/docker-builds"
    staging_root: "temp_workspace/docker-cases"
    case_map: {}

user:
  user_name: "your-obs-user"
  password: "set-locally"
  target_project: "home:your-user:case_study"
  repository_name: "arm"
  architecture_name: "aarch64"
  obs_api_url: "https://api.opensuse.org"
